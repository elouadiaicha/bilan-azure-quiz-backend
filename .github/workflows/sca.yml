name: SCA - OWASP Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Cache persistant de la base NVD utilisée par OWASP Dependency-Check.
      # La clé reste identique entre les différents runs.
      - name: Restore OWASP Dependency Check database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ runner.os }}-v1

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Run OWASP Dependency Check
        id: dependency-check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw
          org.owasp:dependency-check-maven:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DdataDirectory=$HOME/.dependency-check
          -DsuppressionFiles=owasp-suppressions.xml
          -DfailBuildOnCVSS=9

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Enforce Dependency Check result
        if: steps.dependency-check.outcome == 'failure'
        run: |
          echo "OWASP Dependency Check detected a vulnerability with CVSS >= 9."
          exit 1